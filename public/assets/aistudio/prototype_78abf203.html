<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大股東在幹嘛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 社群動態牆：左側選單＋中間 600px 貼文串＋右側話題；貼文附圖卡，黃色只用在圖卡和重點 */
:root{
  --bg:#FFFFFF;--panel:#F6F6F3;--ink:#101010;--muted:#6B6E73;--line:#E6E6E1;--hover:#F2F2EE;
  --hl:#FFE14D;--on-hl:#101010;--hi:#C2410C;--hi-bg:#FFF1E8;--hi-fg:#9A3412;--mid:#3730A3;--mid-bg:#EEF0FF;
  --card-dark:#101010;--on-dark:#FFFFFF;
  --sans:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101010;--panel:#181818;--ink:#F3F3F1;--muted:#9A9DA3;--line:#2A2A2A;--hover:#1C1C1C;
  --hi:#F08A4B;--hi-bg:#3A2216;--hi-fg:#FDBA8C;--mid:#A5B4FC;--mid-bg:#23264A;--card-dark:#232323;--on-dark:#F3F3F1;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101010;--panel:#181818;--ink:#F3F3F1;--muted:#9A9DA3;--line:#2A2A2A;--hover:#1C1C1C;
  --hi:#F08A4B;--hi-bg:#3A2216;--hi-fg:#FDBA8C;--mid:#A5B4FC;--mid-bg:#23264A;--card-dark:#232323;--on-dark:#F3F3F1;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
/* 每一頁外框都一樣寬：左側選單固定 240px、位置不動，只有右側欄在寬版頁面隱藏 */
.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:24px;justify-content:stretch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.left{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding-block:20px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:6px 10px 18px}
.brand b{font-size:19px;font-weight:900}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:#101010;overflow:hidden}
.av svg{width:36px;height:36px}
.av.co{background:var(--panel);color:var(--ink);font-weight:900;font-size:15px;border:1px solid var(--line)}
.nav a{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:17px}
.nav a svg{width:24px;height:24px;flex:none}
.nav a:hover{background:var(--hover)}
.nav a[aria-current="page"]{font-weight:900}
.nav a[aria-current="page"] svg{stroke-width:2.6}
.btn{min-height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
.btn.hl{background:var(--hl);color:var(--on-hl)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.center{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh;min-width:0}
.feedhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}
.feedhead h1{font-size:19px;font-weight:900;margin:0;padding:14px 16px 4px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:1;text-align:center;padding:12px 14px;color:var(--muted);text-decoration:none;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs a:hover{background:var(--hover)}
.post{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.post:hover{background:color-mix(in srgb,var(--hover) 50%,transparent)}
.who{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:15px}
.who b{font-weight:900}
.who .muted{font-size:14px}
.pin{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:2px}
.txt{white-space:pre-line;margin-top:2px}
.txt a.ht{color:var(--mid);text-decoration:none;font-weight:500}
.txt a.ht:hover{text-decoration:underline}
.att{margin-top:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.att.y{background:var(--hl);color:var(--on-hl);border-color:var(--hl);padding:22px 22px 18px}
.att.d{background:var(--card-dark);color:var(--on-dark);border-color:var(--card-dark);padding:20px}
.att.p{padding:14px 16px}
.att .num{font-family:var(--mono);font-weight:600;font-size:clamp(36px,8vw,54px);line-height:1}
.att .cap{font-size:14px;font-weight:700;margin-top:6px}
.att .src{font-size:12px;opacity:.7;margin-top:10px}
.acts{display:flex;gap:4px;margin:8px 0 0 -10px}
.acts button,.acts a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.acts button:hover,.acts a:hover{background:var(--hover);color:var(--ink)}
.acts svg{width:19px;height:19px}
.acts [aria-pressed="true"]{color:var(--hi)}
.lst{display:flex;flex-direction:column}
.lst div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.lst div:last-child{border-bottom:0}
.att.y .lst div{border-color:rgba(0,0,0,.12)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--panel);color:var(--ink);white-space:nowrap}
.tag.hi{background:var(--hi-bg);color:var(--hi-fg)}
.tag.mid{background:var(--mid-bg);color:var(--mid)}
.tag.y{background:var(--hl);color:var(--on-hl)}
.bar{height:8px;background:rgba(127,127,127,.18);border-radius:4px;margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px;background:currentColor}
.right{padding-block:16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start}
.box{background:var(--panel);border-radius:16px;padding:14px 16px}
.box h2{font-size:18px;font-weight:900;margin:0 0 6px}
.trend{display:block;padding:9px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.trend:last-child{border-bottom:0}
.trend small{display:block;color:var(--muted);font-size:13px}
.trend b{font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:999px;padding:0 16px;height:46px;border:1px solid transparent}
.search:focus-within{border-color:var(--ink);background:var(--bg)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.sugg a{display:flex;align-items:center;gap:12px;padding:10px 16px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.sugg a:hover{background:var(--hover)}
.prof{border-bottom:1px solid var(--line)}
.prof .cover{height:110px;background:var(--hl);position:relative}
.prof .cover span{position:absolute;right:16px;bottom:10px;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--on-hl)}
.prof .body{padding:0 16px 16px}
.prof .avbig{width:86px;height:86px;border-radius:50%;margin-top:-43px;border:4px solid var(--bg);background:var(--panel);display:grid;place-items:center;font-weight:900;font-size:26px}
.prof h1{margin:8px 0 0;font-size:24px;font-weight:900}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.stats b{font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chip{min-height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--mid);color:#FFFFFF;padding:12px 18px;border-radius:999px;font-weight:700;z-index:20}
/* 儀表板 */
body.wide .shell{grid-template-columns:240px minmax(0,1fr)}
body.wide .right{display:none}
body.wide .center{border-right:0}
.dhead{padding:18px 24px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dhead h1{font-size:24px;font-weight:900;margin:0}
.dhead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sec{padding:18px 24px;border-bottom:1px solid var(--line)}
.sec h2{font-size:17px;font-weight:900;margin:0}
.sec .sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tl-axis,.tl-row{display:grid;grid-template-columns:230px minmax(0,1fr) 92px;gap:16px;align-items:center}
.tl-axis{font-size:11px;color:var(--muted);padding-bottom:4px}
.months{position:relative;height:16px}
.months span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-row{padding:10px 0;border-top:1px solid var(--line)}
.tl-row.new{background:linear-gradient(90deg,color-mix(in srgb,var(--hl) 35%,transparent),transparent 40%)}
.tl-name{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.tl-name b{font-weight:900}
.tl-name .note{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:34px}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.track.tall .tick{top:4px;bottom:4px}
.track.tall{height:30px;border-bottom:1px dashed var(--line)}
.track .today{position:absolute;right:0;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border:0;padding:0;cursor:pointer;display:block}
.mk.insider{background:var(--hl);outline:2px solid var(--ink);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.mk.control{background:var(--hi);clip-path:polygon(50% 0,100% 100%,0 100%);width:16px;height:16px}
.mk.pledgeUp{background:var(--mid);border-radius:50%}
.mk.fined{background:var(--ink);border-radius:2px;width:11px;height:11px}
.mk.trade{background:transparent;border:2px solid var(--hi);border-radius:50%}
.rng{position:absolute;top:50%;height:10px;transform:translateY(-50%);background:var(--hi);opacity:.8;border-radius:3px;min-width:6px;cursor:pointer;border:0;padding:0}
.rng.ins{background:var(--hl);opacity:1;outline:1.5px solid var(--ink)}
.early{position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--hi-fg);font-weight:700;background:var(--bg);padding:0 4px;border-radius:4px}
.pl{text-align:right;font-family:var(--mono);font-size:13px}
.pl .bar{margin-left:auto;width:80px}
.rmbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;padding:2px 4px}
.rmbtn:hover{color:var(--ink);text-decoration:underline}
.addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.addrow .search{height:40px;max-width:320px;flex:1}
.pop{position:relative}
.pop .sugg{position:absolute;left:0;right:0;top:44px;z-index:8;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12);max-width:420px}
.pop .sugg button{display:flex;width:100%;justify-content:space-between;gap:8px;padding:9px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pop .sugg button:hover{background:var(--hover)}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 24px}
.diff h3{font-size:14px;font-weight:900;margin:0 0 6px;display:flex;justify-content:space-between}
.diff ul{list-style:none;margin:0 0 14px;padding:0}
.diff li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.diff li a{color:var(--ink);font-weight:700;text-decoration:none}
.diff li a:hover{text-decoration:underline}
.cmp{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.cmp .me{width:44px;height:44px;border-radius:50%;background:var(--mid-bg);color:var(--mid);display:grid;place-items:center;font-weight:900}
.cmp-open{all:unset;cursor:text;display:block;width:100%;box-sizing:border-box;padding:11px 0;color:var(--muted);font-size:17px}
.cmp textarea{width:100%;min-height:96px;border:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:17px;line-height:1.55;padding:8px 0;outline:none}
.cmp .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ty{min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.ty[aria-pressed="true"]{background:var(--mid-bg);border-color:var(--mid);color:var(--mid)}
.cochip{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 4px 0 10px;border-radius:999px;background:var(--panel);font-size:13px;font-weight:700}
.cochip button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cochip button:hover{background:var(--hover)}
.coadd{position:relative}
.coadd input{min-height:30px;border:1px dashed var(--line);border-radius:999px;padding:0 12px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink);width:150px}
.cosug{position:absolute;top:34px;left:0;z-index:6;min-width:220px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.cosug button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:9px 12px;font-size:14px}
.cosug button:hover,.cosug button:focus-visible{background:var(--hover)}
.coprev{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px}
.quote{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);position:relative}
.quote b{color:var(--ink)}
.warn{background:var(--hi-bg);color:var(--hi-fg);border-radius:10px;padding:8px 12px;font-size:13px}
.cmp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.ring{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ring.over{color:var(--hi)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.more-wrap{position:relative;margin-left:auto}
.more-btn{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.more-btn:hover{background:var(--hover);color:var(--ink)}
.menu{position:absolute;right:0;top:34px;z-index:6;min-width:170px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.menu button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:11px 14px;font-size:14px}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--hi-fg)}
.menu button[disabled]{color:var(--muted);cursor:default}
.post a.ht{color:var(--mid);text-decoration:none;font-weight:500}
.post a.ht:hover{text-decoration:underline}
.utag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--mid-bg);color:var(--mid)}
dialog.rep{border:0;border-radius:16px;padding:0;width:min(420px,calc(100vw - 32px));background:var(--bg);color:var(--ink)}
dialog.rep::backdrop{background:rgba(0,0,0,.45)}
dialog.rep form{padding:20px;display:flex;flex-direction:column;gap:10px}
dialog.rep h3{margin:0;font-size:18px;font-weight:900}
dialog.rep label.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
dialog.rep label.opt:has(input:checked){border-color:var(--ink)}
dialog.rep textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;min-height:64px;background:var(--bg);color:var(--ink)}
.sumcards{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.sumcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:84px}
.sumcard:hover{background:var(--hover)}
.sumcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sumcard b{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.sumcard span{font-size:13px;color:var(--muted)}
.sumcard i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--panel)}
.sumcard i.hi{background:var(--hi)}.sumcard i.mid{background:var(--mid)}.sumcard i.y{background:var(--hl);outline:1px solid var(--ink)}
.mx{width:100%;min-width:640px;border-collapse:collapse;font-size:13px;table-layout:fixed}
.mx col.ci{width:150px}.mx col.ct{width:70px}
.mxwrap{overflow-x:auto;margin-top:10px}
.mx th,.mx td{padding:0;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.mx thead th{font-weight:700;color:var(--muted);padding:6px 4px;font-size:12px;white-space:normal;line-height:1.3;vertical-align:bottom}
.mx tbody th{text-align:left;font-weight:500}
.mx tbody th button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:7px 8px;overflow:hidden;text-overflow:ellipsis}
.mx td button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:7px 4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mx td button:hover,.mx th button:hover{background:var(--hover)}
.mx td button:focus-visible,.mx th button:focus-visible{outline:2px solid var(--mid);outline-offset:-2px}
.mx td.z button{color:var(--line)}
.mx td.l1 button{background:color-mix(in srgb,var(--hi) 12%,transparent)}
.mx td.l2 button{background:color-mix(in srgb,var(--hi) 28%,transparent)}
.mx td.l3 button{background:color-mix(in srgb,var(--hi) 50%,transparent);font-weight:600}
.mx td.sel button,.mx th.sel button{box-shadow:inset 0 0 0 2px var(--ink)}
.mx .tot{font-family:var(--mono);color:var(--muted)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.fbar .act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700}
.pill button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.pill button:hover{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.sortsel{font:inherit;font-size:13px;min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 8px}
.rl{width:100%;border-collapse:collapse}
.rl th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.rl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.rl tr{cursor:pointer}
.rl tbody tr:hover{background:var(--hover)}
.rl .nm{min-width:84px}
.rl .nm a{color:var(--ink);text-decoration:none;font-weight:700}
.rl .tags{display:flex;flex-wrap:wrap;gap:4px}
.rl .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.more{display:block;margin:14px auto 0}
.lane{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;font-size:13px}
.evlist{list-style:none;margin:0;padding:0}
.evlist li{display:grid;grid-template-columns:96px 110px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.kv{display:flex;flex-wrap:wrap;gap:28px}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.2}
.kv span{font-size:13px;color:var(--muted)}
.ex{font-size:12px;font-weight:700;background:var(--panel);color:var(--muted);padding:2px 8px;border-radius:999px}

.mbar,.mtop{display:none}

  const trends=[['signals','連環訊號',multi.length+' 家公司'],['pledge','董監質押超過八成',D.cos.filter(c=>c.p>=80).length+' 家'],['control','經營權易主',D.control.length+' 家'],['risk','被處置中',D.disp.length+' 檔']];
  const fl=[...follow].filter(c=>BY[c]);
  return `<a class="search" href="#search" style="text-decoration:none">${I.search}<span class="muted">搜尋公司</span></a>
  <div class="box"><h2>今天在聊</h2>${trends.map(([h,t,n])=>`<a class="trend" href="#${h}"><small>台股・公開資料</small><b>${t}</b><small>${n}</small></a>`).join('')}</div>
  <div class="box"><h2>你追蹤的公司</h2>${fl.length?fl.map(c=>`<a class="trend" href="#co-${c}"><b>${esc(BY[c].n)}</b><small>${BY[c].k.map(k=>SIG[k][0]).join('・')||'目前沒有訊號'}</small></a>`).join(''):'<p class="note">在公司頁按「追蹤」，有新紀錄就會出現在這裡。</p>'}</div>
  <p class="note" style="padding:0 4px">資料來源：政府資料開放平臺（證交所、櫃買中心、集保、金管會），2026-10-30。只整理公開資訊，不提供買賣建議。原型，部分按鈕為示意。</p>`;
}

function render(){
  const h=(location.hash||'#dash').slice(1);
  const isCo=h.startsWith('co-'),isU=h.startsWith('u-');
  const FEEDS=['feed','talk','signals','pledge','control','risk'];
  const key=isCo?'co':(['dash','radar','search',...FEEDS].includes(h)?h:'dash');
  const wide=['dash','radar','co'].includes(key);
  document.body.classList.toggle('wide',wide);
  app.innerHTML=isU?vUser(h.slice(2)):isCo?vCompanyDash(h.slice(3)):key==='dash'?vDash():key==='radar'?vRadar():key==='search'?vSearch():feed(key);
  const navKey=isU?'feed':key==='co'?'':FEEDS.includes(key)?'feed':key;
  document.querySelectorAll('#nav a,#mbar a').forEach(a=>{if(a.getAttribute('href').slice(1)===navKey)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(!wide)$('#right').innerHTML=right();
  if(key==='radar')drawRadar();
  bindComposer();
  if(key==='search'){drawRes();$('#q').addEventListener('input',e=>{q=e.target.value;drawRes()})}
  const aq=$('#addq');if(aq)aq.addEventListener('input',e=>drawAdd(e.target.value));
}
function setWl(code,add){if(add&&!wl.includes(code))wl.push(code);if(!add)wl=wl.filter(c=>c!==code);saveWl();toast(add?'已加入追蹤清單':'已從追蹤清單移除');const y=scrollY;render();scrollTo(0,y)}
document.addEventListener('click',e=>{
  const pt=e.target.closest('[data-ptab]');if(pt){e.preventDefault();ptab=pt.dataset.ptab;render();return}
  const bk=e.target.closest('[data-block]');if(bk){const u=bk.dataset.block;blocked.has(u)?blocked.delete(u):blocked.add(u);saveBlk();openMenu=null;toast(blocked.has(u)?'已封鎖，你不會再看到他的貼文':'已解除封鎖');render();return}
  const mb=e.target.closest('[data-menu]');if(mb){openMenu=openMenu===mb.dataset.menu?null:mb.dataset.menu;const y=scrollY;render();scrollTo(0,y);return}
  if(openMenu&&!e.target.closest('.menu')){openMenu=null;const y=scrollY;render();scrollTo(0,y)}
  const rp=e.target.closest('[data-report],[data-fix]');if(rp){const fix=rp.hasAttribute('data-fix');const id=rp.dataset.report||rp.dataset.fix;openMenu=null;
    $('#reph').textContent=fix?'回報資料錯誤':id.startsWith('user-')?'檢舉這位用戶':'檢舉這則貼文';$('#repsub').textContent=fix?'哪裡寫錯了？我們會對照政府原始資料修正。':'站長會在 24 小時內處理。被 3 人以上檢舉的貼文會先自動隱藏。';
    $('#repopts').innerHTML=(fix?['數字錯誤','公司名稱或代號錯誤','日期錯誤','解讀有誤導','其他']:['報明牌或喊單','招攬代操或拉群','不實消息','人身攻擊或騷擾','廣告洗版','其他']).map((r,i)=>`<label class="opt"><input type="radio" name="why" value="${r}" ${i===0?'checked':''}>${r}</label>`).join('');
    $('#repnote').value='';const dlg=$('#repdlg');dlg.dataset.rid=id;dlg.dataset.kind=fix?'fix':'rep';dlg.showModal();render();return}
  if(e.target.closest('[data-repclose]')){$('#repdlg').close();return}
  const dl=e.target.closest('[data-del]');if(dl){if(confirm('確定刪除這則貼文？')){UP=UP.filter(p=>p.id!==dl.dataset.del);saveUP();openMenu=null;render();toast('已刪除')}return}
  const ed=e.target.closest('[data-edit]');if(ed){const p=UP.find(x=>x.id===ed.dataset.edit);if(p){editing=p.id;cmp={open:true,ty:p.ty,co:[...p.co],text:p.text,quote:null};openMenu=null;location.hash='#talk';render();scrollTo(0,0)}return}
  if(e.target.closest('[data-cmp-open]')){cmp.open=true;rerenderCmp();$('#cmptxt')?.focus();return}
  if(e.target.closest('[data-cmp-cancel]')){cmp={open:false,ty:'心得分享',co:[],text:'',quote:null};editing=null;rerenderCmp();return}
  const ty=e.target.closest('[data-ty]');if(ty){cmp.ty=ty.dataset.ty;rerenderCmp();return}
  const ac=e.target.closest('[data-addco]');if(ac){cmp.co.push(ac.dataset.addco);rerenderCmp();$('#coq')?.focus();return}
  const uc=e.target.closest('[data-unco]');if(uc){cmp.co=cmp.co.filter(c=>c!==uc.dataset.unco);rerenderCmp();return}
  if(e.target.closest('[data-unquote]')){cmp.quote=null;rerenderCmp();return}
  if(e.target.closest('[data-cmp-send]')){if(editing){const p=UP.find(x=>x.id===editing);Object.assign(p,{text:cmp.text,ty:cmp.ty,co:cmp.co})}else UP.unshift({id:'m'+Date.now(),uid:'me',name:'我',ini:'我',d:D.today,ty:cmp.ty,co:cmp.co,text:cmp.text,likes:0,mine:true});
    saveUP();toast(editing?'已儲存':'已發布（原型：只存在這台瀏覽器）');cmp={open:false,ty:'心得分享',co:[],text:'',quote:null};editing=null;location.hash='#talk';render();return}
  const dc=e.target.closest('[data-discuss]');if(dc){const p=ALL.find(x=>x.id===dc.dataset.discuss);cmp={open:true,ty:'資料解讀',co:(p?.co||[]).slice(0,3),text:'',quote:dc.dataset.discuss};location.hash='#talk';render();scrollTo(0,0);$('#cmptxt')?.focus();return}
  const lk=e.target.closest('[data-like]');if(lk){const k='like-'+lk.dataset.like;saved.has(k)?saved.delete(k):saved.add(k);store();const y=scrollY;render();scrollTo(0,y);return}
  const t=e.target.closest('[data-toast]');if(t){toast(t.dataset.toast);return}
  const rs=e.target.closest('[data-rsig]');if(rs){const k=rs.dataset.rsig;radarSet(rf.sig===k&&!rf.ind?null:k,null);return}
  const ri=e.target.closest('[data-rind]');if(ri){const k=ri.dataset.rind;radarSet(null,rf.ind===k&&!rf.sig?null:k);return}
  const rc=e.target.closest('[data-rcell]');if(rc){const [i,k]=rc.dataset.rcell.split('|');radarSet(rf.ind===i&&rf.sig===k?null:k,rf.ind===i&&rf.sig===k?null:i);return}
  const rx=e.target.closest('[data-rclear]');if(rx){rf[rx.dataset.rclear]=null;rlimit=40;const y=scrollY;render();scrollTo(0,y);return}
  if(e.target.closest('[data-rmore]')){rlimit+=40;drawRadar();return}
  const go=e.target.closest('tr[data-go]');if(go&&!e.target.closest('a')){location.hash='#co-'+go.dataset.go;return}
  const sv=e.target.closest('[data-save]');if(sv){const id=sv.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);store();const on=saved.has(id);sv.setAttribute('aria-pressed',on);sv.innerHTML=I.save+(on?'已收藏':'收藏');toast(on?'已收藏':'已取消收藏');return}
  const sh=e.target.closest('[data-share]');if(sh){const p=ALL.find(x=>x.id===sh.dataset.share);const tmp=document.createElement('div');tmp.innerHTML=p?p.text:'';const txt=tmp.textContent+'\n— 大股東在幹嘛';
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('貼文文字已複製')).catch(()=>toast('無法複製，請手動選取文字'));return}
  const ad=e.target.closest('[data-add]');if(ad){setWl(ad.dataset.add,true);return}
  const rm=e.target.closest('[data-rm]');if(rm){setWl(rm.dataset.rm,false);return}
  const wb=e.target.closest('[data-wl]');if(wb){setWl(wb.dataset.wl,!wl.includes(wb.dataset.wl));return}
  const mkb=e.target.closest('.mk,.rng');if(mkb){toast(mkb.getAttribute('aria-label'));return}
  const cb=e.target.closest('[data-cond]');if(cb){cond=cond===cb.dataset.cond?null:cb.dataset.cond;q='';const qi=$('#q');if(qi)qi.value='';document.querySelectorAll('[data-cond]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cond===cond));drawRes();return}
  if(e.target.closest('#fol')){const code=location.hash.slice(4);follow.has(code)?follow.delete(code):follow.add(code);store();toast(follow.has(code)?'已追蹤，有新紀錄會通知你':'已取消追蹤');const y=scrollY;render();scrollTo(0,y);return}
  if(e.target.closest('[data-back]')){history.length>1?history.back():(location.hash='#today')}
});
document.addEventListener('submit',ev=>{if(ev.target.id!=='repform')return;const d=$('#repdlg');if(d.dataset.kind==='fix')toast('謝謝回報，我們會對照原始資料確認');else{reported.add(d.dataset.rid);toast('已送出檢舉');const y=scrollY;render();scrollTo(0,y)}});
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#u-'))ptab='posts';render();scrollTo(0,0)});
render();
}
</script>

<dialog class="rep" id="repdlg"><form method="dialog" id="repform"><h3 id="reph">檢舉這則貼文</h3><p class="note" id="repsub" style="margin:0">站長會在 24 小時內處理。被 3 人以上檢舉的貼文會先自動隱藏。</p><div id="repopts"></div><textarea id="repnote" maxlength="100" placeholder="補充說明（選填，100 字內）"></textarea><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn line" data-repclose style="min-height:38px">取消</button><button type="submit" class="btn" id="repsend" style="min-height:38px">送出</button></div></form></dialog>
</body>
</html>
